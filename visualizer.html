<style>
  :root { --ink:#16202b; --muted:#5d6b78; --line:#d5dbe1; --accent:#e8771e; --panel:rgba(255,255,255,0.86); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#eef1f4; font-family:Inter,system-ui,sans-serif; color:var(--ink); }
  #view { position:fixed; inset:0; }
  #view canvas { display:block; }
  #cap { position:fixed; left:28px; top:24px; max-width:min(520px, calc(100vw - 56px)); background:var(--panel); backdrop-filter:blur(6px);
         border:1px solid var(--line); border-radius:12px; padding:16px 20px 17px; box-shadow:0 6px 24px rgba(20,30,40,0.08); transition:opacity .35s; }
  #cap .step { font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
  #cap .txt { font-size:17px; line-height:1.42; font-weight:500; }
  #brand { position:fixed; right:28px; top:26px; text-align:right; font-size:12.5px; color:var(--muted); line-height:1.5; }
  #brand b { display:block; color:var(--ink); font-size:15px; font-weight:700; letter-spacing:.01em; }
  #bar { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; width:min(980px, calc(100vw - 24px)); background:var(--panel);
         backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:14px; padding:10px 14px 12px; box-shadow:0 6px 24px rgba(20,30,40,0.10); }
  #row1 { display:flex; align-items:center; gap:12px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:6px 11px; cursor:pointer; font-size:13.5px; }
  button:hover { border-color:#aab4be; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #play { width:40px; height:34px; padding:0; font-size:15px; }
  #scrub { flex:1; accent-color:var(--accent); }
  #time { font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); min-width:92px; text-align:right; }
  #row2 { display:flex; align-items:center; gap:6px; margin-top:9px; flex-wrap:wrap; }
  #row2 .sp { flex:1; }
  .chip { font-size:12.5px; padding:5px 9px; }
  .chip.cur { border-color:var(--accent); color:var(--accent); font-weight:600; }
  #hint { font-size:12px; color:var(--muted); }

  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--muted); }

  body:not(.explode) #xui, body:not(.explode) #partCard { display:none; }
  body.explode #view { cursor:grab; }
  body.explode.over-part #view { cursor:pointer; }
  body.explode.grabbing #view { cursor:grabbing; }
  #xui > * { opacity:0; transition:opacity .6s; pointer-events:none; }
  body.ui #xui > * { opacity:1; pointer-events:auto; }
  .xhead { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .lang-toggle { display:inline-flex; padding:2px; border-radius:999px; font-size:11.5px; font-weight:600; gap:0; }
  .lang-toggle span { padding:2px 7px; border-radius:999px; color:var(--muted); }
  html[lang="es"] .lang-toggle .es, html[lang="en"] .lang-toggle .en { background:var(--ink); color:#fff; }
  .xpanel { background:var(--panel); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid var(--line);
            box-shadow:0 6px 24px rgba(20,30,40,0.08); }
  #xtop { position:fixed; left:28px; top:24px; max-width:min(400px, calc(100vw - 56px)); border-radius:12px; padding:14px 18px 15px; }
  #xtop a { font-size:12.5px; color:var(--muted); text-decoration:none; }
  #xtop a:hover { color:var(--ink); }
  #xtop h1 { font-size:20px; letter-spacing:-.015em; margin:6px 0 4px; }
  #xtop p { margin:0; font-size:13.5px; line-height:1.45; color:var(--muted); }
  #xbar { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; display:flex; gap:8px; align-items:center; border-radius:14px; padding:8px; white-space:nowrap; }
  #xbar .primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  #partCard { position:fixed; z-index:6; top:24px; right:28px; width:min(320px, calc(100vw - 32px)); background:rgba(255,255,255,.95);
              backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(232,119,30,.55); border-radius:14px;
              padding:16px 18px 18px; box-shadow:0 10px 34px rgba(20,30,40,.14); opacity:0; transform:translateY(-8px); pointer-events:none;
              transition:opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
  #partCard.show { opacity:1; transform:none; pointer-events:auto; }
  #partCard .meta { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 26px 6px 0; }
  #partCard .ch { font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#b85a10; }
  #partCard .n { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); }
  #partCard h3 { font-size:18px; line-height:1.25; letter-spacing:-.01em; margin:0 0 6px; font-weight:650; }
  #partCard p { margin:0; font-size:14.5px; line-height:1.5; color:#2b3946; }
  #partCard .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  #partCard .tags span { font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:6px; padding:2px 7px; }
  #partCard .close { all:unset; cursor:pointer; position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; text-align:center;
                     line-height:25px; font-size:17px; color:var(--muted); }
  #partCard .close:hover { background:#eef1f4; color:var(--ink); }
  #partCard .close:focus-visible { outline:2px solid var(--accent); }
  @media (max-width:640px){ #xtop{left:12px;top:12px;right:12px;padding:12px 14px} #xtop p{font-size:12.5px} #xbar{bottom:12px}
    #partCard{top:auto;bottom:70px;left:12px;right:12px;width:auto} }
  @media (max-width:640px){ #cap{left:12px;top:12px;padding:12px 14px} #cap .txt{font-size:15px} #brand{display:none} .chip{font-size:11.5px;padding:4px 7px} }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './assets/OrbitControls.js';

// #record: no controls, a fixed pixel ratio, and frames drawn on demand through window.__render(t).
const REC = location.hash === '#record';
if (REC) document.body.classList.add('rec');

/* ================= animation timeline ================= */
const END = 70;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ramp = (t, start, dur) => clamp((t - start) / dur);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
function keyed(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let k = 0; k < keys.length - 1; k++) {
    const [t0, v0] = keys[k], [t1, v1] = keys[k + 1];
    if (t <= t1) return lerp3(v0, v1, easeInOut(ramp(t, t0, t1 - t0)));
  }
  return keys[keys.length - 1][1];
}

// Sub-assembly offsets: whole groups of parts that move together.
const SUB = {
  sled: t => keyed(t, [[0, [90, 0, 0]], [48.8, [90, 0, 0]], [50.6, [90, 0, 140]], [52.6, [0, 0, 140]], [55.4, [0, 0, 0]]]),
  pcbB: t => keyed(t, [[0, [0, 0, 105]], [28.8, [0, 0, 105]], [30.2, [0, 0, 0]]]),
  pcbA: t => keyed(t, [[0, [0, 0, 105]], [32.6, [0, 0, 105]], [34, [0, 0, 0]]]),
  deck: t => keyed(t, [[0, [0, 0, 55]], [38, [0, 0, 55]], [39.4, [0, 0, 0]]]),
  body: t => keyed(t, [[0, [0, 0, 150]], [42.8, [0, 0, 150]], [46, [0, 0, 0]]]),
  cap:  t => keyed(t, [[0, [0, 0, 45]], [56.2, [0, 0, 45]], [59, [0, 0, 0]]]),
  ant:  t => keyed(t, [[0, [0, 0, 35]], [59.8, [0, 0, 35]], [62, [0, 0, 0]]]),
};
// Screw-in / twist-lock rotations about z.
const ROT = {
  body: t => -(30 * Math.PI / 180) * (1 - easeInOut(ramp(t, 46, 1.5))),
  cap:  t => -2.5 * 2 * Math.PI * (1 - easeInOut(ramp(t, 56.2, 2.8))),
  ant:  t => -4 * 2 * Math.PI * (1 - easeInOut(ramp(t, 59.8, 2.2))),
};

// When each part appears, how long it takes, and where it flies in from.
function schedule(name) {
  const m = name.match(/#(\d+)$/), k = m ? +m[1] : 0;
  const s = o => Object.assign({ d: 1.1, from: [0, 0, 0], subs: [], spin: null }, o);
  const screw = t0 => s({ t: t0 + .35 * k, d: 1.1, from: [0, 0, 24], spin: { ax: 'z', turns: -3 } });
  const is = p => name.startsWith(p);
  if (is('PRINT Sensor base')) return s({ t: 3, d: 1.4, from: [0, 0, -45] });
  if (is('PETG')) return s({ t: 4.6, d: 1, from: [0, 0, 35] });
  if (is('Pi Camera')) return s({ t: 5.6, d: 1.2, from: [0, 0, 45] });
  if (is('SCREW camera')) return screw(6.9);
  if (is('MLX90640')) return s({ t: 8.6, d: 1.2, from: [0, 0, 45] });
  if (is('PRINT MLX clamp')) return s({ t: 9.8, d: 1, from: [0, 0, 30] });
  if (is('SCREW MLX')) return screw(10.8);
  if (is('AS7263')) return s({ t: 12.2, d: 1.2, from: [0, 0, 45] });
  if (is('SCREW AS7263')) return screw(13.4);
  if (is('PRINT Sled')) return s({ t: 16.8, d: 1.4, from: [0, 0, 60], subs: ['sled'] });
  if (is('Raspberry')) return s({ t: 18.6, d: 1.4, from: [0, 60, 0], subs: ['sled'] });
  if (is('SCREW Pi')) return s({ t: 20.1 + .3 * k, d: 1, from: [0, 22, 0], spin: { ax: 'y', turns: 3 }, subs: ['sled'] });
  if (is('18650 holder')) return s({ t: 22, d: 1.3, from: [0, 55, 0], subs: ['sled'] });
  if (is('CELL')) return s({ t: 23.4, d: 1.2, from: [0, 45, 0], subs: ['sled'] });
  if (is('CABLE TIE')) return s({ t: 24.7 + .4 * k, d: 1, from: [0, 30, 0], subs: ['sled'] });
  if (is('PCB B')) return s({ t: 26.3, d: .9, from: [0, 0, 40], subs: ['sled', 'pcbB'] });
  if (is('B - ')) {
    let r = ['U4', 'U9', 'U8 LoRa Ra-02 module', 'U8 LoRa Ra-02 shield', 'U8 LoRa Ra-02 IPEX', 'U5'].findIndex(x => name.includes(x));
    if (r < 0) r = 0;
    const o = r >= 2 && r <= 4 ? 2 + (r - 2) * .35 : r > 4 ? 3 : r;
    return s({ t: 26.9 + .3 * o, d: .7, from: [0, 18, 0], subs: ['sled', 'pcbB'] });
  }
  if (is('PCB A')) return s({ t: 30.4, d: .9, from: [0, 0, 40], subs: ['sled', 'pcbA'] });
  if (is('A - ')) {
    let r = ['U1', 'SW1', 'U2', 'U3', 'U6', 'U7'].findIndex(x => name.includes(x));
    if (r < 0) r = 0;
    return s({ t: 31 + .24 * r, d: .7, from: [0, -18, 0], subs: ['sled', 'pcbA'] });
  }
  if (is('PRINT Antenna deck')) return s({ t: 34.4, d: 1, from: [0, 0, 40], subs: ['sled', 'deck'] });
  if (is('SMA')) return s({ t: 35.4, d: 1.1, from: [0, 0, -28], subs: ['sled', 'deck'] });
  if (is('GPS patch')) return s({ t: 36.6, d: 1, from: [0, 0, 30], subs: ['sled', 'deck'] });
  if (is('SCREW antenna deck')) return s({ t: 39.6 + .35 * k, d: 1.1, from: [0, 0, 22], spin: { ax: 'z', turns: -3 }, subs: ['sled'] });
  if (is('SHELL Body')) return s({ t: 42.2, d: .6, subs: ['body'], rot: 'body' });
  if (is('SHELL Top')) return s({ t: 55.8, d: .5, subs: ['cap'], rot: 'cap' });
  if (is('433 MHz')) return s({ t: 59.4, d: .5, subs: ['ant'], rot: 'ant' });
  return s({ t: 0, d: .1 });
}

/* ================= exploded view (what the visualizer opens on) ================= */
// Where each part sits when the finished can is pulled apart, as an offset in mm from where it is fitted, and when it
// sets off (0…EXP_SPREAD of the way through the explosion: the outside comes off first, the sensor base last).
// The base and its sensors stay at the bottom, the sled above them, the electronics fanned out along y above that
// (each board with its parts lifted off the side they are fitted to), then the deck, the cap and the antenna.
// The shell body steps aside so nothing is hidden inside it.
const EXP_SPREAD = .55, ZE = 190;
function explodeOf(name) {
  const is = p => name.startsWith(p), e = (x, y, z, d) => ({ off: [x, y, z], d });
  if (is('433 MHz')) return e(0, 0, 300, 0);
  if (is('SHELL Top')) return e(0, 0, 262, .05);
  if (is('SHELL Body')) return e(-125, -65, 0, .1);
  if (is('PRINT Antenna deck')) return e(0, 0, 205, .17);
  if (is('SMA')) return e(0, 0, 232, .19);
  if (is('GPS patch')) return e(0, 0, 222, .19);
  if (is('SCREW antenna deck')) return e(0, 0, 232, .21);
  if (is('PRINT Sled')) return e(0, 0, 88, .26);
  if (is('PCB B')) return e(0, -38, ZE, .28);
  if (is('PCB A')) return e(0, 34, ZE, .28);
  if (is('B - ')) return e(0, -14, ZE, .31);
  if (is('A - ')) return e(0, 12, ZE, .31);
  if (is('Raspberry')) return e(0, -70, ZE, .3);
  if (is('SCREW Pi')) return e(0, -92, ZE, .34);
  if (is('18650 holder')) return e(0, 62, ZE, .3);
  if (is('CELL')) return e(0, 95, ZE, .33);
  if (is('CABLE TIE')) return e(0, 128, ZE, .36);
  if (is('PETG')) return e(0, 0, 20, .42);
  if (is('Pi Camera') || is('MLX90640') || is('AS7263')) return e(0, 0, 34, .42);
  if (is('PRINT MLX clamp')) return e(0, 0, 46, .46);
  if (is('SCREW camera') || is('SCREW AS7263')) return e(0, 0, 52, .5);
  if (is('SCREW MLX')) return e(0, 0, 60, .5);
  return e(0, 0, 0, 0);
}
// Parts that are picked together: the pieces of one component, and every screw or tie of one set.
const pickKey = name => name.startsWith('B - U8') ? 'B - U8' : name.replace(/#\d+$/, '');
// What the card says when a part is clicked: [match, chapter, title, text, tags].
const PART_INFO = [
  [/^SHELL Body/, '05 · Shell', 'Grated shell body', 'The outer wall of the can. It comes down over the sensor base and twists to lock its bayonet. The gratings keep it light and let air reach the sensors.', ['3D printed', 'bayonet lock', 'Ø66 mm']],
  [/^SHELL Top/, '06 · Close', 'Threaded top cap', 'Screws onto the body to close the can, and clamps the antenna deck down at the same time.', ['3D printed', 'threaded']],
  [/^PRINT Sensor base/, '01 · Sensor base', 'Printed sensor base', 'The bottom of the can. It replaces the old shell bottom and carries all three downward-looking sensors, so they see the ground during the descent.', ['3D printed', 'Ø66 mm']],
  [/^PETG/, '01 · Sensor base', 'PETG window', 'A thin clear disc over the camera opening. It protects the lens while letting it look straight down through the base.', ['16 × 0.5 mm', 'PETG']],
  [/^Pi Camera/, '01 · Sensor base', 'Pi Camera Module 2 NoIR', 'A camera with no infrared-blocking filter, fitted with a blue gel. It sees near-infrared and blue light at once, the classic setup for NDVI-style vegetation imaging.', ['SC0024', 'NoIR', 'blue gel']],
  [/^SCREW camera/, '01 · Sensor base', 'Camera screws', 'Four self-tapping screws that hold the Pi Camera down on the sensor base.', ['M2×6', 'self-tapping']],
  [/^MLX90640/, '01 · Sensor base', 'MLX90640 thermal camera', 'A 32 × 24 pixel thermal imager. Plastic blocks thermal infrared, so it looks through an open hole in the base instead of a window.', ['Pimoroni PIM365', '19 × 22 mm', '55° FOV']],
  [/^PRINT MLX clamp/, '01 · Sensor base', 'MLX clamp bar', 'A printed bar that presses the thermal camera flat against the base.', ['3D printed']],
  [/^SCREW MLX/, '01 · Sensor base', 'Clamp screws', 'Two self-tapping screws that pull the clamp bar down over the thermal camera.', ['M2×8', 'self-tapping']],
  [/^AS7263/, '01 · Sensor base', 'AS7263 NIR spectrometer', 'Measures six near-infrared bands, adding spectral readings of the ground to the two images.', ['SparkFun SEN-14351', '25.4 × 25.4 mm']],
  [/^SCREW AS7263/, '01 · Sensor base', 'Spectrometer screws', 'Two M3 screws that hold the spectrometer board and finish the sensor base.', ['M3×8']],
  [/^PRINT Sled/, '02 · Sled', 'The sled', 'The backbone of the electronics. The Raspberry Pi mounts on one side and the battery on the other, and both PCBs slide down into it.', ['3D printed']],
  [/^Raspberry/, '02 · Sled', 'Raspberry Pi Zero 2 W', 'The payload computer that runs the cameras and the spectrometer, with its microSD card already fitted.', ['Pi Zero 2 W', 'microSD']],
  [/^SCREW Pi/, '02 · Sled', 'Pi screws', 'Four self-tapping screws, heads on the Pi, that hold it onto the posts inside the sled.', ['M2.5×4', 'self-tapping']],
  [/^18650 holder/, '02 · Sled', '18650 battery holder', 'Sits between the sled’s guide rails, on the opposite face from the Pi.', ['LX3214', '77.5 × 21 × 21.5 mm']],
  [/^CELL/, '02 · Sled', 'Samsung 30Q cell', 'One 18650 lithium-ion cell powers the whole can.', ['INR18650-30Q', 'Ø18.33 × 64.85 mm', 'Li-ion']],
  [/^CABLE TIE/, '02 · Sled', 'Cable ties', 'Two ties wrap the holder and the cell so nothing shifts on landing.', ['2.5 mm']],

// Camera keys ([time, target, distance, azimuth°, elevation°]); the distance grows on screens narrower than 16:9.
function camAt(t) {
  let k = 0;
  while (k < CAM.length - 2 && t > CAM[k + 1][0]) k++;
  const a = CAM[k], b = CAM[k + 1], f = easeInOut(ramp(t, a[0], b[0] - a[0])), tg = lerp3(a[1], b[1], f);
  const d = (a[2] + (b[2] - a[2]) * f) * Math.max(1, 16 / 9 / camera.aspect);
  const az = (a[3] + (b[3] - a[3]) * f) * Math.PI / 180, el = (a[4] + (b[4] - a[4]) * f) * Math.PI / 180;
  return { tg, pos: [tg[0] + d * Math.cos(el) * Math.cos(az), tg[1] + d * Math.cos(el) * Math.sin(az), tg[2] + d * Math.sin(el)] };
}

/* ---------- the model (vertex data shared with the other pages) ---------- */
const parts = [], pickables = [];
let expG = 0;                        // exploded view: 0 (the finished can) → 1 (every part pulled apart)
let hideK = 0;                       // going into the build: every part but the sensor base fades out (0 → 1)
function loadModel() {
  return new Promise((resolve, reject) => {
    if (window.CANSAT_MODEL) return resolve(window.CANSAT_MODEL);
    const s = document.createElement('script');
    s.src = 'assets/cansat-model.js';
    s.onload = () => resolve(window.CANSAT_MODEL);
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
function buildMeshes(model) {
  for (const { part: p, pos, index, edges } of model.decode()) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(index, 1));
    geo.translate(-p.c[0], -p.c[1], -p.c[2]);
    geo.computeVertexNormals();
    // The outline: the part's feature edges (worked out ahead of time), drawn from the part's own vertex buffer.
    const edgeGeo = new THREE.BufferGeometry();
    edgeGeo.setAttribute('position', geo.attributes.position);
    edgeGeo.setIndex(new THREE.BufferAttribute(edges, 1));
    const metal = /^(SCREW|SMA)/.test(p.name);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.SRGBColorSpace),
      roughness: metal ? .35 : .62, metalness: metal ? .75 : .02, side: THREE.DoubleSide,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = mesh.receiveShadow = true;
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x1b2530, transparent: true, opacity: .28 });
    mesh.add(new THREE.LineSegments(edgeGeo, edgeMat));
    const pivot = new THREE.Group();
    pivot.add(mesh);
    scene.add(pivot);
    const P = { m: p, s: schedule(p.name), ex: explodeOf(p.name), key: pickKey(p.name), pivot, mesh, mat, edgeMat, isBody: p.name.startsWith('SHELL Body'), isBase: p.name.startsWith('PRINT Sensor base'), transparent: false };
    mesh.userData.P = P;
    parts.push(P);
    pickables.push(mesh);
  }
}

// Shell body goes see-through while the sled is lowered in.
const shellFade = t => t < 47.8 ? 1 : t < 62 ? 1 - .8 * easeInOut(ramp(t, 47.8, .8)) : .2 + .8 * easeInOut(ramp(t, 62, 1.5));
function poseParts(t) {
  for (const P of parts) {
    const s = P.s, n = ramp(t, s.t, s.d), shown = t >= s.t;
    P.pivot.visible = shown;
    if (!shown) continue;
    let off = lerp3(s.from, [0, 0, 0], easeOut(n));
    for (const k of s.subs) { const o = SUB[k](t); off = [off[0] + o[0], off[1] + o[1], off[2] + o[2]]; }
    if (expG > 0) {                 // exploded view: each part sets off in turn, outside first
      const f = easeInOut(clamp(expG * (1 + EXP_SPREAD) - P.ex.d)), o = P.ex.off;
      off = [off[0] + o[0] * f, off[1] + o[1] * f, off[2] + o[2] * f];
    }
    P.pivot.position.set(P.m.c[0] + off[0], P.m.c[1] + off[1], P.m.c[2] + off[2]);
    P.pivot.rotation.set(0, 0, 0);
    if (s.spin) P.pivot.rotation[s.spin.ax] = s.spin.turns * 2 * Math.PI * (1 - easeOut(n));
    if (s.rot) P.pivot.rotation.z = ROT[s.rot](t);
    let a = clamp(n / .3);
    if (P.isBody) a *= shellFade(t);
    if (hideK > 0 && !P.isBase) a *= 1 - hideK;
    const tr = a < .999;
    if (tr !== P.transparent) {
      P.mat.transparent = tr; P.mat.depthWrite = !tr; P.mat.needsUpdate = true;
      P.transparent = tr;
    }
    P.mesh.castShadow = !tr || a > .5;   // (checked every time: a part fading out drops its shadow half way)
    P.mat.opacity = a;
    P.edgeMat.opacity = .28 * a * (P.isBody && shellFade(t) < .99 ? 0 : 1);
  }
}

// Compile in the background where the browser can (KHR_parallel_shader_compile); elsewhere just compile now.
const compileShaders = () => renderer.extensions.has('KHR_parallel_shader_compile')
  ? renderer.compileAsync(scene, camera) : Promise.resolve(renderer.compile(scene, camera));
// Compile every shader before the first frame, including the see-through version the parts switch to as they fade
// in, so the first fade doesn't stall while it compiles.
async function warmShaders() {
  const fades = parts.map(P => P.mat);
  await compileShaders();
  for (const m of fades) m.transparent = !m.transparent;
  try { await compileShaders(); }
  finally { for (const m of fades) { m.transparent = !m.transparent; m.needsUpdate = true; } }
}

/* ================= controls ================= */
const capStep = document.getElementById('capStep'), capTxt = document.getElementById('capTxt');
let capShown = -1;
function caption(t) {
  let c = 0;
  for (let i = 0; i < CAPTIONS.length; i++) if (t >= CAPTIONS[i][0]) c = i;
  if (c !== capShown) { const es = I18N.lang === 'es'; capStep.textContent = es ? CAPTIONS_ES[c][0] : CAPTIONS[c][1]; capTxt.textContent = es ? CAPTIONS_ES[c][1] : CAPTIONS[c][2]; capShown = c; }
}

let time = 0, playing = !REC, speed = 1, follow = true, lastNow = performance.now();
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), play = document.getElementById('play');
const chips = [];
CHAPTERS.forEach(([name, t], i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = i + 1 + ' ' + I18N.t(name, CHAPTERS_ES[i]);
  b.onclick = () => { time = t; follow = true; followBtn.classList.add('on'); };
  document.getElementById('chips').appendChild(b);
  chips.push([b, t]);
});
addEventListener('langchange', () => { chips.forEach(([b], i) => { b.textContent = i + 1 + ' ' + I18N.t(CHAPTERS[i][0], CHAPTERS_ES[i]); }); capShown = -1; if (selKey) fillCard(selKey); });
const followBtn = document.getElementById('follow');
followBtn.onclick = () => { follow = !follow; followBtn.classList.toggle('on', follow); };
play.onclick = () => { if (!playing && time >= END) time = 0; playing = !playing; };
scrub.oninput = () => { time = +scrub.value; };
document.getElementById('speed').onclick = e => { speed = speed === 1 ? 2 : speed === 2 ? .5 : 1; e.target.textContent = speed + '×'; };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); play.click(); } });
controls.addEventListener('start', () => { follow = false; followBtn.classList.remove('on'); });

/* ================= exploded view ================= */
// The visualizer opens on the finished can, framed the way the landing page leaves it in the middle of the screen,
// and pulls it apart. Opened from the landing page's resting can, it is loaded out of sight in a frame there and
// waits on that first frame until the landing page says "go" (with the heading its can is turning through), then
// carries on from exactly that frame, so the hand-over can't be seen.
const embedded = window.parent !== window && new URLSearchParams(location.search).has('handoff');
const tellParent = msg => { try { parent.postMessage({ runnysat: msg }, location.origin); } catch (e) {} };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let mode = REC || location.hash === '#build' ? 'build' : 'explode';   // 'explode' | 'toBuild' (gliding into the build) | 'build'
let waiting = embedded && mode === 'explode', goPending = false;
let az0 = 330, xClock = 0, userTook = false, fog0 = null, turn = 7;
const X_DELAY = .35;                       // s before it comes apart; `turn` is the landing page's slow turn (deg/s)
if (embedded) {
  // Links that leave this page take the whole window with them, not just this frame.
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || a.target) return;
    e.preventDefault();
    top.location.href = new URL(a.href, location.href).href;
  });
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.runnysat !== 'go' || !waiting) return;
    az0 = e.data.az; if (Array.isArray(e.data.fog)) fog0 = e.data.fog;
    // Keep the landing page's turn going; if it was still swinging fast, settle to the slow turn the same way round.
    if (Number.isFinite(e.data.turn)) turn = Math.abs(e.data.turn) < 60 ? e.data.turn : 7 * Math.sign(e.data.turn);
    waiting = false; goPending = true; xClock = 0; dirty = true;
  });
}
function handoffTick(drew) {
  if (!embedded || !drew) return;
  if (waiting && !handoffTick.ready) { handoffTick.ready = true; tellParent('ready'); }   // drawn once, so the shaders are warm
  else if (goPending) { goPending = false; tellParent('shown'); }
}
const W_ = () => innerWidth, H_ = () => innerHeight;
// The landing page's hand-over frame: the can in the middle at 350 mm, scaled up on narrow screens.
const heroScale = () => Math.max(1, (W_() >= 900 || W_() >= H_() ? 1.6 : .95) * H_() / W_());

const EXP = { target: [0, 0, 200], h: 460, w: 340, r: 300, el: 15 };
const vC = new THREE.Vector3(), box = new THREE.Box3(), pbox = new THREE.Box3();
function measureExplode() {
  box.makeEmpty();
  for (const P of parts) {
    P.mesh.geometry.computeBoundingBox();
    pbox.copy(P.mesh.geometry.boundingBox).translate(vC.set(P.m.c[0] + P.ex.off[0], P.m.c[1] + P.ex.off[1], P.m.c[2] + P.ex.off[2]));
    box.union(pbox);
  }
  box.getCenter(vC);
  EXP.target = [vC.x, vC.y, vC.z];
  EXP.h = box.max.z - box.min.z;
  let w = 0;   // as it turns, the widest it gets across the screen
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) w = Math.max(w, Math.hypot(x - vC.x, y - vC.y));
  EXP.w = 2 * w;
  EXP.r = Math.hypot(w, EXP.h / 2);
}
// Camera distance that fits the whole exploded can on screen, clear of the panels top and bottom.
function expDist() {
  const t = Math.tan(camera.fov / 2 * Math.PI / 180), H = H_(), clearH = H - (W_() > 640 ? 190 : 230);
  return Math.max(EXP.h * .55 / (t * clearH / H), EXP.w * .52 / (t * W_() / H));
}
// Light: the landing page's hand-over lighting (sun straight over the can) → following the exploded parts →
// the build player's own lighting.
function aimSun(se, build) {
  const bx = build ? 45 : 0, bb = build ? 170 : 150;
  const tx = bx + (EXP.target[0] - bx) * se, ty = EXP.target[1] * se, k = 1 + se;
  sun.target.position.set(tx, ty, 40);
  sun.position.set((build ? 160 : 160 + tx) + 115 * (k - 1), ty - 140 * k, 40 + 280 * k);
  const b = bb + (EXP.r * 1.25 - bb) * se;
  Object.assign(sun.shadow.camera, { left: -b, right: b, top: b, bottom: -b, far: 800 + 800 * se });
  sun.shadow.camera.updateProjectionMatrix();
}
const place = (tg, d, azDeg, elDeg) => {
  const az = azDeg * Math.PI / 180, el = elDeg * Math.PI / 180;
  return [tg[0] + d * Math.cos(el) * Math.cos(az), tg[1] + d * Math.cos(el) * Math.sin(az), tg[2] + d * Math.sin(el)];
};
let focus = null;                    // { t0, t1, d0, d1, dir, t } while gliding onto a clicked part
function xCamera() {
  const e = easeInOut(clamp(expG * 1.15));   // the camera leads the parts a little
  const d0 = 350 * heroScale();
  if (!userTook) {                   // scripted: from the hand-over frame out to the whole exploded can, still turning slowly
    const tg = lerp3([0, 0, 60], EXP.target, e), d = d0 + (expDist() - d0) * e;
    setCam(place(tg, d, az0 + turn * xClock, 16 + (EXP.el - 16) * e), tg);
  } else if (focus) {
    const f = easeInOut(clamp(focus.t));
    controls.target.lerpVectors(focus.t0, focus.t1, f);
    camera.position.copy(controls.target).addScaledVector(focus.dir, focus.d0 + (focus.d1 - focus.d0) * f);
  }
  // The haze: as the landing page had it at the hand-over, then kept behind the can wherever the camera goes.
  const cd = camera.position.distanceTo(controls.target);
  const f0 = fog0 || [700 * heroScale(), 1300 * heroScale()];
  const near = cd * 1.3 + 300, ef = userTook ? 1 : e;
  scene.fog.near = f0[0] + (near - f0[0]) * ef;
  scene.fog.far = f0[1] + (near + 900 - f0[1]) * ef;
  aimSun(e, false);
}
function xStep(dt) {
  if (!waiting && !reduceMotion) xClock += dt;
  if (!waiting && reduceMotion) xClock = X_DELAY + 1;
  if (!waiting && xClock > .25 && mode === 'explode') document.body.classList.add('ui');
  const to = mode === 'toBuild' ? expG : mode === 'explode' && !waiting && xClock >= X_DELAY ? 1 : 0;   // going into the build: the parts stay where they are
  if (expG !== to) {
    const st = reduceMotion ? 1 : dt / (to ? 2.6 : .8);
    expG = to > expG ? Math.min(to, expG + st) : Math.max(to, expG - st);
    dirty = true;
  }
  if (!userTook && !waiting) dirty = true;    // the slow turn
  if (focus) { focus.t += dt / .7; dirty = true; if (focus.t >= 1) focus = null; }
  if (tb) {
    tb.t += dt / TB_DUR;
    hideK = easeInOut(clamp(tb.t / .55));
    dirty = true;
    if (tb.t >= 1) finishToBuild();
  }
}

// Picking parts: hover highlights, a click selects, focuses the camera on it and opens its card.
const card = document.getElementById('partCard');
const ACCENT = new THREE.Color(0xe8771e);
let selKey = null, hoverKey = null, hoverAt = null;
function applyHighlight() {
  for (const P of parts) {
    const on = P.key === selKey ? .42 : P.key === hoverKey ? .2 : 0;
    if (on) P.mat.emissive.copy(ACCENT); else P.mat.emissive.setRGB(0, 0, 0);
    P.mat.emissiveIntensity = on || 1;
  }
  dirty = true;
}
function setHover(key) {
  if (key === hoverKey) return;
  hoverKey = key;
  document.body.classList.toggle('over-part', !!key);
  applyHighlight();
}
function select(key) {
  if (key === selKey) return;
  selKey = key;
  applyHighlight();
  if (!key) { card.classList.remove('show'); return; }
  const group = parts.filter(P => P.key === key);
  box.makeEmpty();
  for (const P of group) box.expandByObject(P.mesh);
  box.getCenter(vC);
  // Glide onto it, closer if the view is far out, keeping the angle you're looking from.
  userTook = true; blend = null;
  const d0 = camera.position.distanceTo(controls.target), size = box.getSize(new THREE.Vector3()).length();
  focus = { t0: controls.target.clone(), t1: vC.clone(), d0, d1: Math.min(d0, Math.max(160, size * 5, expDist() * .45)),
            dir: camera.position.clone().sub(controls.target).normalize(), t: 0 };
  fillCard(key);
}
function fillCard(key) {
  const group = parts.filter(P => P.key === key);
  const info = partInfo(group[0].m.name), n = new Set(group.map(P => P.m.name)).size;
  card.querySelector('.ch').textContent = info.ch;
  card.querySelector('.n').textContent = /#\d+$/.test(group[0].m.name) && n > 1 ? '× ' + n : '';
  card.querySelector('h3').textContent = info.title;
  card.querySelector('p').textContent = info.text;
  card.querySelector('.tags').replaceChildren(...info.tags.map(t => Object.assign(document.createElement('span'), { textContent: t })));
  card.classList.add('show');
}
card.querySelector('.close').addEventListener('click', () => select(null));
addEventListener('keydown', e => { if (e.key === 'Escape' && selKey) select(null); });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set(x / W_() * 2 - 1, 1 - y / H_() * 2);
  ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(pickables, false)) {
    const P = h.object.userData.P;
    if (P.pivot.visible && P.mat.opacity > .5) return P;
  }
  return null;
}
const canvas = renderer.domElement;
let down = null;
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'explode') return;
  down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
  document.body.classList.add('grabbing');
});
canvas.addEventListener('pointermove', e => {
  if (mode === 'explode' && e.pointerType === 'mouse' && !down) hoverAt = [e.clientX, e.clientY];
});
addEventListener('pointerup', e => {
  document.body.classList.remove('grabbing');
  if (!down || e.pointerId !== down.id) return;
  const click = Math.hypot(e.clientX - down.x, e.clientY - down.y) < 5 && performance.now() - down.t < 700;
  down = null;
  if (click && mode === 'explode') { const P = pick(e.clientX, e.clientY); select(P ? P.key : null); }
});
addEventListener('pointercancel', () => { down = null; document.body.classList.remove('grabbing'); });
canvas.addEventListener('pointerleave', () => { hoverAt = null; setHover(null); });
controls.addEventListener('start', () => { if (mode !== 'build') { userTook = true; focus = null; blend = null; } });
if (matchMedia('(pointer: coarse)').matches) {
  const xh = document.getElementById('xhint');
  xh.textContent = 'Drag to rotate · pinch to zoom · two fingers to pan · tap a part to see what it is';
  xh.dataset.es = 'Arrastra para girar · pellizca para hacer zoom · dos dedos para desplazar · toca una pieza para ver qué es';
  I18N.apply();
}

// Between the two views.
// "Watch the build": everything but the sensor base fades out where it is, and the camera glides in onto the base,
// arriving exactly where the build's own camera is at the moment the base has just been seated (T0). The build then
// plays on from there, so the hand-over can't be seen.
const T0 = 4.5, TB_DUR = 1.8;        // s into the build (the base is in, the PETG window not yet); s the glide takes
let tb = null;                       // { t, pos, tg, fog, sun } while gliding into the build
const sph = (pos, tg) => {           // camera offset from its target as distance, azimuth°, elevation°
  const x = pos.x - tg.x, y = pos.y - tg.y, z = pos.z - tg.z, d = Math.hypot(x, y, z);
  return { d, az: Math.atan2(y, x) * 180 / Math.PI, el: Math.asin(clamp(z / d, -1, 1)) * 180 / Math.PI };
};
function startToBuild() {
  select(null); setHover(null);
  focus = null; blend = null; down = null;
  controls.enabled = false;
  document.body.classList.remove('ui', 'over-part', 'grabbing');
  tb = { t: 0, pos: camera.position.clone(), tg: controls.target.clone(), fog: [scene.fog.near, scene.fog.far],
         sunT: sun.target.position.clone(), sunP: sun.position.clone(), b: sun.shadow.camera.right, far: sun.shadow.camera.far };
  mode = 'toBuild';
  if (reduceMotion) finishToBuild();
  dirty = true;
}
const vS = new THREE.Vector3(), vD = new THREE.Vector3();
function tbCamera() {
  const f = easeInOut(clamp(tb.t)), c = camAt(T0);
  vD.set(...c.tg);
  const a = sph(tb.pos, tb.tg), b = sph(vS.set(...c.pos), vD);
  const tg = vT.copy(tb.tg).lerp(vD, f);
  const d = a.d * Math.pow(b.d / a.d, f), az = a.az + (((b.az - a.az) % 360 + 540) % 360 - 180) * f, el = a.el + (b.el - a.el) * f;
  setCam(place([tg.x, tg.y, tg.z], d, az, el), [tg.x, tg.y, tg.z]);
  scene.fog.near = tb.fog[0] + (700 - tb.fog[0]) * f;
  scene.fog.far = tb.fog[1] + (1300 - tb.fog[1]) * f;
  // The light, from wherever the exploded view had it to the build's own.
  sun.target.position.copy(tb.sunT).lerp(vS.set(45, 0, 40), f);
  sun.position.copy(tb.sunP).lerp(vS.set(160, -140, 320), f);
  const bb = tb.b + (170 - tb.b) * f;
  Object.assign(sun.shadow.camera, { left: -bb, right: bb, top: bb, bottom: -bb, far: tb.far + (800 - tb.far) * f });
  sun.shadow.camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;
}
function finishToBuild() {
  tb = null; hideK = 0; expG = 0;
  controls.enabled = true;
  enterBuild(T0, true);
  document.body.classList.add('fadein');
}
function enterBuild(t0 = 0, cut = false) {
  mode = 'build';
  select(null); setHover(null);
  document.body.classList.remove('explode', 'ui');
  aimSun(0, true);
  scene.fog.near = 700; scene.fog.far = 1300;
  time = t0; playing = true; follow = true; followBtn.classList.add('on');
  if (!cut) startBlend();
  dirty = true;
}
function enterExplode() {
  mode = 'explode';
  document.body.classList.remove('fadein');
  playing = false; time = END;
  document.body.classList.add('explode', 'ui');
  // Carry on from where the build camera is looking, turning slowly from that heading.
  const off = camera.position.clone().sub(controls.target);
  az0 = Math.atan2(off.y, off.x) * 180 / Math.PI; xClock = X_DELAY; userTook = false; fog0 = null;
  startBlend();
  dirty = true;
}
document.getElementById('xbuild').onclick = () => { if (mode === 'explode') startToBuild(); };
document.getElementById('toExplode').onclick = () => { if (mode === 'build') enterExplode(); };
document.getElementById('xreset').onclick = () => { select(null); if (userTook) { userTook = false; focus = null; startBlend(); } };
if (mode === 'explode') document.body.classList.add('explode');
else aimSun(0, true);

/* ================= drawing ================= */
// A frame is only drawn when something on screen changes: the build moving, the camera moving (the auto camera,
// dragging, zooming, or the controls still easing to a stop), or the window changing size. A paused build left
// alone costs nothing.
let posedT = NaN, posedE = NaN, posedH = NaN, dirty = true;
controls.addEventListener('change', () => { dirty = true; });
// Switching between the build and the exploded view blends the camera over from where it was, instead of cutting.
let blend = null;                    // { pos, tg, t } while blending
const vP = new THREE.Vector3(), vT = new THREE.Vector3();
function setCam(pos, tg) {
  vP.set(...pos); vT.set(...tg);
  if (blend) { const f = easeInOut(clamp(blend.t)); vP.lerpVectors(blend.pos, vP, f); vT.lerpVectors(blend.tg, vT, f); }
  camera.position.copy(vP);
  controls.target.copy(vT);
  camera.lookAt(vT);
}
function startBlend() { blend = { pos: camera.position.clone(), tg: controls.target.clone(), t: 0 }; }
function aim(t) {
  const c = camAt(t);
  setCam(c.pos, c.tg);
}
function draw(t, force) {
  if (t !== posedT || expG !== posedE || hideK !== posedH) { poseParts(t); posedT = t; posedE = expG; posedH = hideK; renderer.shadowMap.needsUpdate = true; dirty = true; }
  if (mode === 'build') { caption(t); if (follow || REC) aim(t); }
  else if (tb) tbCamera();
  else xCamera();
  controls.update();
  if (force || dirty) { renderer.render(scene, camera); dirty = false; return true; }
  return false;
}
window.__render = t => (time = t, follow = true, draw(t, true), true);

// The bar's readouts, each written only when it changes.
let shown = { play: '', scrub: NaN, time: '', chip: -1 };
function frame(now) {
  const dt = Math.min(.1, (now - lastNow) / 1000);
  lastNow = now;
  if (blend) { blend.t += dt / 1.1; dirty = true; if (blend.t >= 1) blend = null; }
  if (mode !== 'build') xStep(dt);
  if (mode !== 'build') {            // (the glide into the build may have just ended: then this frame is the build's)
    const drew = draw(END);
    handoffTick(drew);
    if (hoverAt && !down && mode === 'explode') { const P = pick(hoverAt[0], hoverAt[1]); setHover(P ? P.key : null); hoverAt = null; }
    requestAnimationFrame(frame);
    return;
  }
  if (playing) { time += dt * speed; if (time >= END) { time = END; playing = false; } }
  const p = playing ? '❚❚' : '▶';
  if (p !== shown.play) play.textContent = shown.play = p;
  if (time !== shown.scrub) scrub.value = shown.scrub = time;
  const tt = time.toFixed(1) + ' / ' + END.toFixed(1) + ' s';
  if (tt !== shown.time) timeEl.textContent = shown.time = tt;
  let cur = 0;
  chips.forEach(([, t], i) => { if (time >= t - .01) cur = i; });
  if (cur !== shown.chip) { chips.forEach(([b], i) => b.classList.toggle('cur', i === cur)); shown.chip = cur; }
  draw(time);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  dirty = true;
});

loadModel().then(model => {
  buildMeshes(model);
  measureExplode();
  return warmShaders().catch(() => {});
}).then(() => {
  document.getElementById('load').remove();
  window.__ready = true;
  lastNow = performance.now();
  if (REC) draw(0, true); else requestAnimationFrame(frame);
}).catch(() => { const l = document.getElementById('load'); l.removeAttribute('data-es'); l.textContent = I18N.t('Could not load the 3D model.', 'No se pudo cargar el modelo 3D.'); tellParent('failed'); });
</script>
